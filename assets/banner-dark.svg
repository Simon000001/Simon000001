        <path d="M0 0H85" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
        <path d="M85 -12V12M85 -12H98M85 12H98" stroke="#fb923c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g><circle r="8" fill="#121315" stroke="#8ab4f0" stroke-width="4"/></g>
    </g><circle r="9" fill="#121315" stroke="#8ab4f0" stroke-width="4"/>
  </g>
</g>
<g transform="translate(900 220)">

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Simon G C. Robots that balance, plan and grab things.">
<rect width="1000" height="260" fill="#121315"/>
<g stroke="#2a2c30" stroke-width="1"><path d="M0 220H1000"/></g>
<text x="48" y="112" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#e8e8e6" letter-spacing="-2.5">Simon G C</text>
<text x="50" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" fill="#9a9ca3">I like robots that don't fall over.</text>
<g transform="translate(700 220)">

  <g><animateTransform attributeName="transform" type="translate" values="-30 0;30 0;-30 0" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <rect x="-24" y="-20" width="48" height="18" rx="3" fill="#1a1b1e" stroke="#8ab4f0" stroke-width="3"/>
    <g transform="translate(0 -20)"><g><animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="2.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
